name: Appium Tests on BrowserStack

on:
  push:
    branches: [ ci, main ]
  pull_request:
    branches: [ ci, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Remover ts-node (evita conflito de ES Modules)
        run: rm -rf node_modules/ts-node

      - name: Baixar o aplicativo
        run: |
          mkdir -p app
          curl -L -o app/native-demo-app.apk https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/android.wdio.native.app.v2.2.0.apk

      - name: Rodar testes no BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: npx wdio run wdio.bs.conf.js